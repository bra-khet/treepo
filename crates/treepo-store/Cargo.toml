[package]
name = "treepo-store"
description = "Application-data persistence: repository identity, the store layout, and versioned atomic manifest I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# A much smaller `gix` than `treepo-vcs` needs, and deliberately so. This crate reads two
# things from a repository — its remotes and its root commit — and nothing else. No blob
# diffing, no status, no attributes, no mailmap. Naming the minimum is what keeps a later
# "while we're here" read from quietly appearing in the crate that decides where data lives.
[dependencies]
# `Fx`, `Seed`, `OrderedMap` and `OrderedSet` all cross the manifest boundary, so the codec
# has to name their types even though it only moves their bytes around.
treepo-det = { workspace = true }
treepo-model = { workspace = true }

gix = { version = "0.86", default-features = false, features = [
  "revision",             # F-MAN-3 tier 2 — the root-commit walk
  "sha1",                 # object hashing — gix does not build without a hash backend
  "max-performance-safe", # perf without a C dependency
] }

# The manifest encoding architecture D9/E2 chose. postcard has no field names, no padding and
# no options that change the bytes, which is what makes `AC-MAN-1`'s byte-identical
# requirement a property of the format rather than of how carefully it is called.
#
# serde derives on the mirror types in `manifest_io::stored`, never on `treepo-model` — see
# that module for why. `treepo-det` keeps its zero-dependency claim intact as a result.
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }

# For the small files D9 keeps as JSON so `N2`'s inspectability promise holds where a person
# would actually look. Deferred through the previous sprint on the grounds that a serializer
# for output nothing reads back is a dependency bought for nothing; `identity.json` is the
# first file treepo must *read*, and hand-rolling a parser for a file users are invited to
# open — and may hand-edit — is the worse of the two engineering choices.
serde_json = "1"

# Fixtures for the three identity tiers: `multi-remote` (tier 1), `no-remote` (tier 2), and
# `empty` (tier 3). Dev-only, as in treepo-vcs — it shells out to `git`, which the product
# never does (R1, architecture D3).
#
# `treepo-vcs` is here for the same reason and only that reason: the product resolves identity
# from what `discover` found, and a test that opened repositories its own way would not be
# testing that composition. `dep-guard` reads normal and build edges only, so this does not
# widen what the crate actually depends on.
[dev-dependencies]
corpus = { path = "../../tools/corpus" }
treepo-vcs = { workspace = true }

[lints]
workspace = true
