# cargo-deny — the N2 enforcement mechanism.
#
# Requires cargo-deny 0.16 or newer (the `crate = "name"` ban spec).
#
# N2 says repository data never leaves the machine and the product is fully functional
# offline. The mechanism is not a policy document: **there is no network-capable crate in
# the product dependency graph**, so there is no code path that could send anything
# anywhere. Adding a transport crate does not get code-reviewed — it fails the build.
#
# Run this check on DEFAULT FEATURES ONLY:
#
#     cargo deny check
#
# Never `--all-features`. The `brp` feature on treepo-app (architecture D10) deliberately
# pulls Bevy's localhost remote-protocol stack for agent tooling; it is never enabled in a
# default build, a release build, or a storefront package (RISK-D). The BRP crates are in
# the ban list below precisely so that making `brp` a default feature fails here.

[advisories]
yanked = "deny"
ignore = [
  # RUSTSEC-2026-0192 — `ttf-parser` is unmaintained. **Unmaintained, not vulnerable**: the
  # author has stated the crate will receive no further fixes, and the advisory offers no
  # upgrade ("No safe upgrade is available").
  #
  # Reached only one way, and only on one platform:
  #   ttf-parser → owned_ttf_parser → ab_glyph → sctk-adwaita → winit → bevy_winit
  # `sctk-adwaita` is Wayland client-side window decorations, so it is linked on Linux and on
  # neither Windows nor macOS. The three ways out are all worse than the notice: dropping
  # Bevy's `wayland` feature abandons the default display server on modern Linux (`N8`),
  # forking the chain to `skrifa` is a font stack treepo does not own, and pinning an older
  # winit forgoes upstream fixes for a crate that is not vulnerable.
  #
  # Re-examine when Bevy or winit moves off `ab_glyph`, and whenever this advisory becomes a
  # vulnerability rather than a maintenance notice. Recorded 2026-07-30, Phase 5.
  "RUSTSEC-2026-0192",
]

[licenses]
# treepo's own crates are `publish = false` and skipped via `private.ignore`.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  # MPL-2.0 is weak, file-level copyleft: the obligation attaches to the MPL-licensed
  # source files themselves, not to a work that merely links them. Used unmodified as a
  # transitive dependency it requires attribution and, if those files are ever modified,
  # publication of the modified files — it does not reach treepo's own source.
  #
  # Added deliberately rather than pre-emptively. It first appeared via `uluru`, an LRU
  # cache inside `gix-pack`, so the alternative was giving up gix (architecture D3) over a
  # cache implementation. Attribution for that crate (and the full MPL-2.0 text) lives in
  # LICENSE-THIRD-PARTY.md at the repo root. Worth a lawyer's glance before the storefront
  # release, since this note is an engineering reading and not legal advice.
  "MPL-2.0",
  # MIT-0 is MIT with the attribution clause removed — strictly more permissive than MIT,
  # which is already allowed, and it imposes no obligation at all. Added when Bevy arrived in
  # Phase 5: the `encase` family (GPU buffer layout, used by `bevy_render`) is licensed under
  # it. Nothing to do at packaging time, which is the whole difference from MPL-2.0 above.
  "MIT-0",
]
confidence-threshold = 0.93
exceptions = []
# The allow-list is written for the dependency set the product will have, not the one it
# has today. Until those crates arrive, every entry is "unused" and warning about each one
# would bury a real finding in noise. This silences only "you allowed a license nothing
# uses" — never "this license is not allowed".
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

# Every entry below is a crate that can open a connection, terminate TLS, resolve a name,
# or ship data off the machine. A build failure here is N2 working, not N2 obstructing —
# if one of these becomes genuinely necessary, that is a constitutional conversation
# (Constitution §9), not a deny.toml edit.
deny = [
  # -- HTTP clients ------------------------------------------------------------------
  { crate = "reqwest", reason = "N2: HTTP client — no network path exists in the product" },
  { crate = "ureq", reason = "N2: HTTP client" },
  { crate = "isahc", reason = "N2: HTTP client" },
  { crate = "attohttpc", reason = "N2: HTTP client" },
  { crate = "minreq", reason = "N2: HTTP client" },
  { crate = "surf", reason = "N2: HTTP client" },
  { crate = "curl", reason = "N2: HTTP client" },
  { crate = "curl-sys", reason = "N2: HTTP client" },

  # -- HTTP protocol / servers -------------------------------------------------------
  { crate = "hyper", reason = "N2: HTTP implementation" },
  { crate = "hyper-util", reason = "N2: HTTP implementation" },
  { crate = "h2", reason = "N2: HTTP/2 implementation" },
  { crate = "h3", reason = "N2: HTTP/3 implementation" },
  { crate = "axum", reason = "N2: HTTP server" },
  { crate = "actix-web", reason = "N2: HTTP server" },
  { crate = "warp", reason = "N2: HTTP server" },
  { crate = "tide", reason = "N2: HTTP server" },
  { crate = "rouille", reason = "N2: HTTP server" },
  { crate = "tiny_http", reason = "N2: HTTP server" },
  { crate = "tonic", reason = "N2: gRPC" },

  # -- TLS ---------------------------------------------------------------------------
  # Nothing in a product with no transport has anything to encrypt in transit.
  { crate = "rustls", reason = "N2: TLS — implies a network transport" },
  { crate = "tokio-rustls", reason = "N2: TLS" },
  { crate = "hyper-rustls", reason = "N2: TLS" },
  { crate = "native-tls", reason = "N2: TLS" },
  { crate = "hyper-tls", reason = "N2: TLS" },
  { crate = "openssl", reason = "N2: TLS" },
  { crate = "openssl-sys", reason = "N2: TLS" },
  { crate = "webpki", reason = "N2: TLS certificate verification" },
  { crate = "webpki-roots", reason = "N2: TLS root store" },

  # -- Async runtimes with network I/O -----------------------------------------------
  # Bevy's task pool is `async-executor`; nothing in the product needs a network reactor.
  # `mio` is deliberately absent — Bevy's asset file-watcher uses it for inotify, which is
  # local filesystem I/O.
  { crate = "tokio", reason = "N2: network-capable runtime — Bevy uses async-executor" },
  { crate = "async-std", reason = "N2: network-capable runtime" },
  { crate = "async-net", reason = "N2: async TCP/UDP" },
  { crate = "socket2", reason = "N2: raw socket API" },

  # -- WebSockets --------------------------------------------------------------------
  { crate = "tungstenite", reason = "N2: WebSocket" },
  { crate = "tokio-tungstenite", reason = "N2: WebSocket" },
  { crate = "websocket", reason = "N2: WebSocket" },

  # -- Name resolution ---------------------------------------------------------------
  { crate = "hickory-resolver", reason = "N2: DNS" },
  { crate = "hickory-proto", reason = "N2: DNS" },
  { crate = "trust-dns-resolver", reason = "N2: DNS" },
  { crate = "trust-dns-proto", reason = "N2: DNS" },

  # -- Telemetry, crash reporting, analytics -----------------------------------------
  # N2 second clause: no telemetry containing repository data, and storefront/platform
  # integrations are never a channel for it. The product carries no reporter at all.
  { crate = "sentry", reason = "N2: crash reporting is not a channel for repository data" },
  { crate = "sentry-core", reason = "N2: crash reporting" },
  { crate = "opentelemetry", reason = "N2: telemetry export" },
  { crate = "tracing-opentelemetry", reason = "N2: telemetry export" },

  # -- Bevy Remote Protocol (D10) ----------------------------------------------------
  # Dev-only agent tooling behind treepo-app's non-default `brp` feature. Present here so
  # that promoting `brp` to a default feature fails this check (RISK-D).
  { crate = "bevy_remote", reason = "D10: dev-only agent tooling; never in a default or release build" },
  { crate = "bevy_brp_extras", reason = "D10: dev-only agent tooling; never in a default or release build" },
]

skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
