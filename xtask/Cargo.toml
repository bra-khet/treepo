[package]
name = "xtask"
description = "treepo's task runner: the constraint gates from the campaign's Standing Rules, as commands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

# No *external* dependencies, deliberately. This binary is what CI runs to decide whether a
# constraint holds; anything it depends on is something that could change the answer.
#
# The workspace crates below are here because `readonly-audit` has to run the real extraction
# passes — auditing a reimplementation would prove nothing about the product. The audit's
# observing half is held to the original rule and uses `std::fs` and `treepo-det` only, so the
# thing doing the measuring shares no code with the thing being measured; see the module docs
# in src/readonly_audit.rs.
#
# `treepo-gen` joined them in Phase 3, for the same reason: `determinism` and `budget` both
# grow real skeletons, because a harness that gated on its own copy of the L-system would be
# gating on the copy. `treepo-id` joined in Phase 4 for `AC-ID-2`, which is the same claim
# about pseudonyms and author colours.
[dependencies]
treepo-det = { workspace = true }
treepo-gen = { workspace = true }
treepo-id = { workspace = true }
treepo-model = { workspace = true }
treepo-store = { workspace = true }
treepo-vcs = { workspace = true }

# The fixtures to audit. Dev-time only, exactly as in treepo-vcs's dev-dependencies: it shells
# out to `git`, which the product never does (R1, architecture D3).
corpus = { path = "../tools/corpus" }

[lints]
workspace = true
