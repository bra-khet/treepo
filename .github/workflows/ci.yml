name: CI

# Build and test on all three target platforms (N8), plus the constraint gates from the
# campaign's Standing Rules that do not need a determinism comparison of their own.
# Cross-platform *output* equality lives in determinism.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A build warning is a build failure. The lint policy in Cargo.toml and clippy.toml is
  # only a policy if something enforces it.
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: build & test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not hide what the other two would have said — a
      # platform-specific determinism failure is exactly the kind of thing that shows up
      # on one runner and nowhere else.
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest }
          - { name: macos, os: macos-latest }
          - { name: windows, os: windows-latest }
    steps:
      # Full history, not the default single commit. `treepo-vcs`'s integration tests walk
      # this repository's own history (F-EXT-2), and a shallow checkout would leave them
      # asserting almost nothing while still passing — the quiet kind of green.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Installs exactly the toolchain pinned in rust-toolchain.toml, which is a
      # determinism input rather than a convenience.
      - name: Install pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # Bevy links against the system's input and windowing libraries, and the GitHub image
      # does not carry their headers. `libudev` is gamepad enumeration, the two `l*x*` ones
      # are Wayland. No `libasound`: the workspace asks bevy for `2d` and `ui` only, so there
      # is no audio backend to link (crates/treepo-app/Cargo.toml).
      - name: Install Linux windowing headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libudev-dev libwayland-dev libxkbcommon-dev

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # On all three platforms rather than in a job of its own, because what it audits is
      # filesystem behaviour: Windows is where a stray handle is most likely to leave
      # something behind, and the symlink and non-UTF-8 shapes only exist on unix and Linux.
      # The corpus is already built by the step above, so this costs seconds.
      - name: Assert extraction writes nothing (AC-MAN-2, AC-EXT-4)
        run: cargo xtask readonly-audit

      # Two steps rather than one, and the self-test runs first: if the detector is broken,
      # "zero unaccountable pixels" and "zero pixels examined" print the same thing. Same
      # argument as `readonly-audit --self-test`, and the same running order.
      #
      # In this job because it needs a built corpus, which the test step above already made.
      # On all three platforms because the rasterizer is float arithmetic and D6/E1 exempts
      # *pixels* from cross-platform identity — so a plane that disagreed by platform would be
      # allowed to, and a coverage hole that only appeared on one would not be.
      - name: Prove the ID-coverage scan can fail (N7, P1)
        run: cargo xtask id-coverage --self-test

      - name: Assert no coloured texel lacks an element ID (N7, P1)
        run: cargo xtask id-coverage

  lint:
    name: fmt & clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2

      # As in the test job — clippy compiles the workspace, and that includes bevy.
      - name: Install Linux windowing headers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libudev-dev libwayland-dev libxkbcommon-dev

      - name: Formatting
        run: cargo fmt --all -- --check

      # clippy.toml's disallowed-types and disallowed-methods are how N3 is enforced
      # against HashMap iteration order and wall-clock reads.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  dep-guard:
    name: dep-guard (N6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2

      # No crate in the generative set may reach bevy, under any feature combination
      # (architecture D1). This is what keeps the phase boundary a compile-time fact.
      - name: Assert crate dependency boundaries
        run: cargo xtask dep-guard

  deny:
    name: cargo-deny (N2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # DEFAULT FEATURES ONLY. `brp` (architecture D10) deliberately pulls Bevy's
      # localhost remote-protocol stack for agent tooling, and enabling it here would put
      # network crates into the graph this check exists to keep clean (RISK-D). Do not add
      # `--all-features`, and do not add `--features brp`.
      - name: Check dependency bans, licences, advisories, sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --workspace
