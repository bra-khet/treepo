[workspace]
resolver = "3"
members = [
  "crates/treepo-det",
  "crates/treepo-model",
  "crates/treepo-vcs",
  "crates/treepo-store",
  "crates/treepo-gen",
  "crates/treepo-id",
  "crates/treepo-render",
  "crates/treepo-app",
  "xtask",
  "tools/corpus",
  "tools/m0-silhouette",
]

# Crates are added here as their phase lands (architecture §File Tree). Phase 0 ships the
# determinism foundation and the task runner that gates every later phase; Phase 1 adds the
# model every later crate exchanges values in.

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
repository = "https://github.com/bra-khet/treepo"
publish = false

[workspace.dependencies]
treepo-det = { path = "crates/treepo-det" }
treepo-model = { path = "crates/treepo-model" }
treepo-vcs = { path = "crates/treepo-vcs" }
treepo-store = { path = "crates/treepo-store" }
treepo-gen = { path = "crates/treepo-gen" }
treepo-id = { path = "crates/treepo-id" }
treepo-render = { path = "crates/treepo-render" }

# Bevy is pinned to a minor line, which is RISK-C's mitigation rather than habit: Bevy's
# release cadence breaks APIs, and the phase boundary (D1) confines it to the two crates
# below so that an upgrade is bounded work. `0.19` is a caret requirement — 0.19.x moves
# freely, 0.20 needs a decision.
#
# `default-features = false` drops audio and the whole 3-D stack (gltf, pbr, mikktspace,
# tonemapping LUTs). treepo draws a still 2-D tree; shipping a gltf loader and an audio
# device in it would be dependency surface nothing in the product can reach.
bevy = { version = "0.19", default-features = false, features = ["2d", "ui"] }

# Lint policy applies to every member via `[lints] workspace = true`.
#
# Crate-specific determinism rules that cannot be expressed workspace-wide — notably
# `clippy::float_arithmetic`, which the render layer will legitimately need — live as
# inner attributes in the crate that is bound by them.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# N3 — the disallowed lists in clippy.toml are the enforcement; these raise them to errors.
disallowed_types = "deny"
disallowed_methods = "deny"

# Dependencies are optimized even in dev builds. Bevy's recommended profile from Phase 5
# onward; a no-op while the workspace has no external dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
